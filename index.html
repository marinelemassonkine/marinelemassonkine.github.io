<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marine Le Masson">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Marine Le Masson · Renforcement musculaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FBF6F8; --surface:#FFFFFF; --surface-2:#F7EEF2;
  --ink:#16203A; --ink-soft:#56607A; --ink-faint:#8A90A6;
  --line:#EFE2E8; --line-strong:#E0CBD5;
  --accent:#1E2A4A; --accent-ink:#FFFFFF; --accent-soft:#EDF0F7;
  --rose:#C8386B; --rose-vif:#E8799F; --rose-soft:#FCE6EE;
  --ok:#2C6A4F; --ok-soft:#E3F1E7;
  --warn:#8A5A12; --warn-soft:#FAF0DC;
  --danger:#B3263E; --danger-soft:#FBE4E8;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(22,32,58,.05), 0 8px 24px -14px rgba(22,32,58,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1326; --surface:#161C33; --surface-2:#1E2542;
    --ink:#EEF0F7; --ink-soft:#A8AFC7; --ink-faint:#7C84A1;
    --line:#262E4D; --line-strong:#353F66;
    --accent:#F29BBC; --accent-ink:#1A1026; --accent-soft:#2A2340;
    --rose:#F29BBC; --rose-vif:#F29BBC; --rose-soft:#3A2440;
    --ok:#8FD1B5; --ok-soft:#18292A;
    --warn:#E8BF72; --warn-soft:#2C2618;
    --danger:#F08A98; --danger-soft:#331C27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1326; --surface:#161C33; --surface-2:#1E2542;
  --ink:#EEF0F7; --ink-soft:#A8AFC7; --ink-faint:#7C84A1;
  --line:#262E4D; --line-strong:#353F66;
  --accent:#F29BBC; --accent-ink:#1A1026; --accent-soft:#2A2340;
  --rose:#F29BBC; --rose-vif:#F29BBC; --rose-soft:#3A2440;
  --ok:#8FD1B5; --ok-soft:#18292A;
  --warn:#E8BF72; --warn-soft:#2C2618;
  --danger:#F08A98; --danger-soft:#331C27;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
img{max-width:100%}
[hidden]{display:none !important}
h1,h2,h3{font-family:"Fraunces", ui-serif, Georgia, serif; font-weight:500; margin:0; text-wrap:balance; letter-spacing:-.01em}

.wrap{max-width:600px; margin:0 auto; padding:0 16px}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:20; padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--rose-soft);
  margin-bottom:18px;
}
.topbar-in{display:flex; align-items:center; gap:12px; padding-block:12px; min-height:60px}
.brand{flex:1; min-width:0}
.brand h1{font-size:19px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brand .sub{font-size:12.5px; color:var(--ink-soft); line-height:1.3; margin-top:2px}
.topbar-sous{display:flex; gap:10px; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); line-height:1.35; padding-bottom:13px; margin-top:-3px}
.topbar-sous .txt{min-width:0}
.entete{font-size:11.5px; line-height:1.4; color:var(--ink-soft); font-weight:600}
.logo{flex:none; width:42px; height:42px; border-radius:13px; overflow:hidden; background:#1E2A4A; display:grid; place-items:center; color:#F29BBC}
.logo svg{width:76%; height:76%; display:block}
.logo img{width:100%; height:100%; object-fit:cover; display:block}
.logo span{font-family:Fraunces,serif; font-weight:600; font-size:17px; color:var(--rose); letter-spacing:.5px}
.logo.grand{width:72px; height:72px; border-radius:20px; margin:0 auto 14px}
.logo.grand span{font-size:28px}
.menu-liste{display:flex; flex-direction:column}
.menu-item{display:flex; gap:13px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:15px 2px; font:inherit; color:inherit; cursor:pointer}
.menu-item:last-child{border-bottom:0}
.menu-item svg{width:22px; height:22px; stroke:var(--rose); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none}
.menu-item .t{flex:1; font-weight:600}
.menu-item .n{flex:none; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--danger); color:#fff; font-size:12px; font-weight:700; line-height:22px; text-align:center}
.menu-item[aria-current="page"] .t{color:var(--rose)}
.topbar-sous b{color:var(--ink-soft); font-weight:700}
.cloche{position:relative; width:40px; height:40px; border-radius:999px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink); cursor:pointer; flex:none}
.cloche svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.cloche.tourne svg{animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.topbar-in{gap:8px; padding-block:13px}
#ptr{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:60; transform:translate(-50%,-70px); background:var(--surface); color:var(--rose); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700; display:flex; gap:8px; align-items:center; transition:transform .15s; pointer-events:none}
#ptr svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#ptr.go svg{animation:tourne .8s linear infinite}
.maj-dispo{display:block; width:100%; text-align:center; cursor:pointer; font:inherit; font-weight:700}
.cloche b{position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--danger); color:#fff; font-size:11px; line-height:18px; text-align:center}
.notif{padding:12px 0; border-bottom:1px solid var(--line)} .notif:last-child{border-bottom:0}
.notif.nonlu .notif-t::before{content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rose-vif); margin-right:7px; vertical-align:middle}
.notif-t{font-weight:700; font-size:14.5px} .notif-c{font-size:14px; line-height:1.45; color:var(--ink-soft); margin-top:2px}
.credit-pill{
  display:flex; align-items:baseline; gap:5px; flex:none;
  background:var(--rose-soft); color:var(--rose);
  padding:7px 12px; border-radius:999px; font-weight:700; font-size:15px;
  font-variant-numeric:tabular-nums;
}
.credit-pill{white-space:nowrap}
.credit-pill span{font-size:11.5px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap}

/* ---------- nav ---------- */
.tabs{
  position:sticky; bottom:0; z-index:20; margin-top:28px;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs-in{display:flex; max-width:600px; margin:0 auto}
.tab{
  flex:1; border:0; background:none; cursor:pointer;
  padding:10px 4px 12px; color:var(--ink-faint);
  font-family:inherit; font-size:11.5px; font-weight:500; letter-spacing:.02em;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  border-top:2px solid transparent; margin-top:-1px;
}
.tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent); border-top-color:var(--rose-vif)}
.tab{position:relative}
.tab i.pastille{position:absolute; top:4px; left:calc(50% + 5px); min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--danger); color:#fff; font-size:10.5px; font-style:normal; line-height:17px; font-weight:700; letter-spacing:0}
.chat{display:flex; flex-direction:column; gap:8px; padding-bottom:6px}
.bulle-l{display:flex; gap:8px; align-items:flex-end; max-width:86%}
.bulle-l.moi{align-self:flex-end; flex-direction:row-reverse}
.bulle-l .avatar{width:28px; height:28px; font-size:10.5px}
.bulle{background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 16px 5px; padding:8px 12px; font-size:15px; line-height:1.4; white-space:pre-wrap; word-break:break-word}
.moi .bulle{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); border-radius:16px 16px 5px 16px}
.marine .bulle{background:var(--rose-soft); border-color:color-mix(in srgb, var(--rose) 22%, transparent)}
.bulle-n{font-size:12px; font-weight:700; color:var(--rose); margin-bottom:2px}
.bulle-h{font-size:11px; color:var(--ink-faint); margin-top:3px; padding:0 4px}
.moi .bulle-h{text-align:right}
.bulle-h button{all:unset; cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.jour-sep{align-self:center; font-size:12px; color:var(--ink-faint); background:var(--surface-2); padding:3px 11px; border-radius:999px; margin:8px 0 2px; text-transform:capitalize}
.msg-info{align-self:stretch; background:var(--surface); border:2px solid var(--rose-vif); border-radius:var(--radius); padding:12px 14px}
.msg-info .t{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--rose); margin-bottom:4px}
.msg-info .c{font-size:15px; line-height:1.45; white-space:pre-wrap; word-break:break-word}
.composer{position:sticky; bottom:calc(64px + env(safe-area-inset-bottom,0px)); z-index:15; background:var(--bg); padding:8px 0 6px; margin-top:6px}
.composer .row{align-items:flex-end}
.composer textarea{flex:1; min-height:44px; max-height:140px; resize:none; border-radius:22px; padding:11px 15px; line-height:1.35}
.composer button[type=submit]{flex:none; width:44px; height:44px; padding:0; border-radius:999px; font-size:18px}
.seg-msg{display:flex; gap:6px; margin-bottom:12px}
.conv{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:12px 2px; cursor:pointer; font:inherit; color:inherit}
.conv:last-child{border-bottom:0}
.conv .nb{flex:none; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--rose); color:#fff; font-size:12px; font-weight:700; line-height:22px; text-align:center}
/* ---------- blocks ---------- */
main{padding-block:14px 24px; min-height:60vh}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:700; margin:26px 0 10px}
.section-title:first-child{margin-top:0}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:10px; align-items:center}
.row-between{display:flex; gap:10px; align-items:center; justify-content:space-between}
.grow{flex:1; min-width:0}
.muted{color:var(--ink-soft); font-size:14px}
.faint{color:var(--ink-faint); font-size:13px}

/* annonces */
.annonce{display:flex; gap:11px; align-items:flex-start; border-radius:var(--radius); padding:13px 15px; font-size:14.5px; line-height:1.5; border:1px solid transparent; box-shadow:var(--shadow)}
.annonce .ico{flex:none; font-size:17px; line-height:1.25}
.annonce .txt{min-width:0}
.annonce .quand{font-size:12px; opacity:.75; margin-top:5px}
.ann-wrap{margin:0 0 20px}
.ann-slides{display:grid}
.ann-slide{grid-area:1/1; opacity:0; visibility:hidden; transition:opacity .35s ease}
.ann-slide.on{opacity:1; visibility:visible}
.ann-dots{display:flex; gap:6px; justify-content:center; margin-top:9px}
.ann-dot{width:7px; height:7px; padding:0; border:0; border-radius:999px; background:var(--line-strong); cursor:pointer; transition:width .25s, background .25s}
.ann-dot.on{width:20px; background:var(--rose)}
.annonce.info{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 20%, transparent)}
.annonce.important{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb, var(--warn) 30%, transparent)}
.annonce b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; opacity:.8; margin-bottom:3px; font-weight:700}

/* day heading */
.day{
  display:flex; align-items:baseline; gap:8px;
  margin:24px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line);
}
.day strong{font-family:"Fraunces",serif; font-size:16px; font-weight:500; text-transform:capitalize}
.day span{font-size:12.5px; color:var(--ink-faint)}

/* slot */
.slot{display:flex; gap:13px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow)}
.slot.mine{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}
.slot.off{opacity:.62}
.time{flex:none; width:52px; text-align:center; font-variant-numeric:tabular-nums}
.time b{display:block; font-size:17px; font-weight:700; letter-spacing:-.02em}
.time small{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:1px}
.slot-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}
.slot-title{font-weight:700; font-size:15px}

.seats{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft)}
.pips{display:flex; gap:3px}
.pip{width:7px; height:7px; border-radius:2px; background:var(--rose-vif); opacity:.95}
.pip.free{background:var(--line-strong); opacity:1}

.badge{display:inline-flex; align-items:center; gap:5px; align-self:flex-start; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.01em}
.badge.ok{background:var(--ok-soft); color:var(--ok)}
.badge.wait{background:var(--warn-soft); color:var(--warn)}
.badge.off{background:var(--danger-soft); color:var(--danger)}
.badge.neutral{background:var(--surface-2); color:var(--ink-soft)}
/* ---------- calendrier ---------- */
.seg{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:11px; margin-bottom:14px}
.seg button{flex:1; border:0; background:none; padding:8px 10px; border-radius:8px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.cal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.cal-head strong{font-family:"Fraunces",serif; font-size:18px; font-weight:500; text-transform:capitalize}
.nav-mois{display:flex; gap:6px}
.nav-mois button{width:36px; height:36px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:17px; cursor:pointer; line-height:1; font-family:inherit}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .dow{text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; padding-bottom:2px}
.jour{
  aspect-ratio:1; border:1px solid var(--line); border-radius:10px; background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  cursor:pointer; font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--ink);
  font-family:inherit; padding:2px;
}
.jour.vide{border:0; background:none; cursor:default}
.jour.auj{border-color:var(--accent); font-weight:700}
.jour.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.jour .pts{display:flex; gap:2px; height:5px}
.jour .pt{width:5px; height:5px; border-radius:50%; background:var(--rose-vif)}
.jour .pt.plein{background:var(--warn)}
.jour.sel .pt{background:var(--accent-ink); opacity:.5}
.jour.sel .pt.plein{opacity:1}
.legende{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--ink-faint)}
.legende span{display:flex; align-items:center; gap:5px}
.legende i{width:6px; height:6px; border-radius:50%; display:block}

/* buttons */
button{font-family:inherit}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid transparent; border-radius:var(--radius-sm);
  padding:11px 15px; font-size:14.5px; font-weight:700; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); line-height:1.2;
  transition:transform .08s ease, opacity .15s ease;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn.soft{background:var(--surface-2); color:var(--ink); border-color:transparent}
.btn.warnish{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.btn.dangerish{background:transparent; color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.btn.full{width:100%}
.btn.sm{padding:7px 11px; font-size:13px; border-radius:8px}
.btn.xs{padding:5px 9px; font-size:12.5px; border-radius:7px; font-weight:700}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
/* forms */
label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.01em}
input, select, textarea{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--radius-sm); padding:11px 12px;
}
textarea{resize:vertical; min-height:64px}
.field{margin-bottom:13px}
.fields-2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
@media (max-width:340px){ .fields-2{grid-template-columns:1fr} }
.fields-2{min-width:0} .fields-2 .field{min-width:0}
.fields-2 input, .fields-2 select{width:100%; min-width:0}
input[type=date]{min-width:0; max-width:100%; box-sizing:border-box; -webkit-appearance:none; appearance:none}
input, select, textarea{box-sizing:border-box; max-width:100%}
.fields-2 .field label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ligne{display:flex; gap:10px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line)}
.ligne:first-child{padding-top:0} .ligne:last-child{border-bottom:0; padding-bottom:0}
.ligne-actions{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.card + .form-suite{margin-top:10px}
.aide{font-size:12.5px; line-height:1.45; color:var(--ink-faint)}
.suggestions{background:var(--rose-soft); border-radius:var(--radius-sm); padding:10px 12px; margin-top:6px}
.suggestions .t{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--rose); margin-bottom:5px}
.suggestions .b{font-size:13.5px; line-height:1.45; color:var(--ink); margin-top:4px}
.suggestions .b b{color:var(--rose)}

.notice{border-radius:var(--radius-sm); padding:11px 13px; font-size:14px; margin-bottom:14px; line-height:1.45}
.notice.err{background:var(--danger-soft); color:var(--danger)}
.notice.ok{background:var(--ok-soft); color:var(--ok)}
.notice.info{background:var(--accent-soft); color:var(--accent)}
.video-frame{display:block; width:100%; aspect-ratio:16/9; border:0; border-radius:var(--radius-sm); background:#000; overflow:hidden}
.video-frame iframe{width:100%; height:100%; border:0; display:block}
.notice.warn{background:var(--warn-soft); color:var(--warn); font-weight:600}

/* auth */
.auth{max-width:420px; margin:0 auto; padding-block:36px 40px}
.auth-head{text-align:center; margin-bottom:26px}
.auth-head h1{font-size:28px; margin-bottom:7px}
.auth-head p{margin:0; color:var(--ink-soft); font-size:14.5px}
.mark{width:46px; height:46px; margin:0 auto 16px; border-radius:50%; background:var(--rose-soft); display:grid; place-items:center}
.mark svg{width:24px; height:24px; stroke:var(--rose); fill:none; stroke-width:1.5; stroke-linecap:round}
.switch{text-align:center; margin-top:16px; font-size:14px; color:var(--ink-soft)}
.linkish{background:none; border:0; color:var(--accent); font-weight:700; cursor:pointer; font-size:14px; padding:2px 4px; text-decoration:underline; text-underline-offset:2px}

/* person row */
.person{display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.person:last-child{border-bottom:0}
.avatar{flex:none; width:36px; height:36px; border-radius:50%; background:var(--rose-soft); color:var(--rose); display:grid; place-items:center; font-weight:700; font-size:13px; overflow:hidden}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.avatar.xl{width:96px; height:96px; font-size:30px; border:3px solid var(--rose-soft)}
.name{font-weight:700; font-size:14.5px}
.count{flex:none; font-variant-numeric:tabular-nums; font-weight:700; font-size:14px; color:var(--ink)}

/* modal */
.sheet-bg{position:fixed; inset:0; background:rgba(10,16,14,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center}
.sheet{
  background:var(--bg); width:100%; max-width:600px; max-height:90vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line); border-bottom:0;
}
@media (min-width:640px){ .sheet-bg{align-items:center} .sheet{border-radius:18px; border-bottom:1px solid var(--line); max-height:86vh} }
.sheet-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:16px}
.sheet-head h2{font-size:20px; flex:1}
.x{border:0; background:var(--surface-2); color:var(--ink-soft); width:32px; height:32px; border-radius:50%; font-size:17px; cursor:pointer; line-height:1; flex:none}

.empty{text-align:center; padding:38px 18px; color:var(--ink-faint)}
.empty svg{width:34px; height:34px; stroke:currentColor; fill:none; stroke-width:1.3; margin-bottom:10px}

.hist{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.hist:last-child{border-bottom:0}
.delta{font-weight:700; font-variant-numeric:tabular-nums; flex:none}
.delta.plus{color:var(--ok)} .delta.minus{color:var(--ink-soft)} .delta.zero{color:var(--danger)}

.loading{text-align:center; padding:50px 0; color:var(--ink-faint); font-size:14px}
.share{background:var(--surface-2); border-radius:var(--radius-sm); padding:11px 12px; font-size:13px; word-break:break-all; color:var(--ink-soft); font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const SUPABASE_URL = 'https://rdisjxpjmzjivlwlaycb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bS-fbBuW7ru_xDywDv_A2A_xHGRGUeN';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ------------------------------------------------------------------ état */
const VERSION = '2026-09-23-r53';
const aujourdhui = new Date();
const S = {
  session:null, profil:null, params:null,
  vue:'cours', creneaux:[], adherentes:[], mouvements:[], historique:[], annonces:[], videos:[], notifs:[], lots:[], demandes:[], rappels:[], msgGroupe:[], msgPrives:[], lectures:{}, conv:null,

  mois:new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), 1),

/* ------------------------------------------------------------------ utils */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fDay  = d => new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d);
const fTime = d => new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(d);

const fCourt = d => new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit'}).format(d);

const ERREURS = {
  non_connectee:"Tu n'es plus connectée. Recharge la page.",
  compte_introuvable:"Compte introuvable.",
  compte_non_valide:"Ton compte n'est pas encore validé par le cabinet.",
  creneau_introuvable:"Ce cours n'existe plus.",
  creneau_annule:"Ce cours a été annulé.",
  creneau_passe:"Ce cours est déjà passé.",
  deja_inscrite:"Tu es déjà inscrite à ce cours.",
  credits_insuffisants:"Il ne te reste plus aucun crédit séance. Contacte Marine pour en rajouter.",

  date_passee:"La date limite doit être aujourd’hui ou plus tard.",
  demande_deja_en_cours:"Tu as déjà une demande en attente. Marine la validera après ton paiement au cabinet.",
  nombre_invalide:"Choisis un nombre de séances entre 1 et 100.",
  demande_introuvable:"Cette demande a déjà été traitée.",
  lot_introuvable:"Ces séances ont déjà été utilisées ou retirées.",
  credits_insuffisants_adherente:"Cette adhérente n’a plus de crédit séance. Ajoute-lui des séances d’abord (onglet Adhérentes).",
  reservation_introuvable:"Réservation introuvable.",
  non_autorisee:"Action non autorisée.",
  adherente_introuvable:"Adhérente introuvable.",
  valeur_nulle:"Indique un nombre différent de zéro.",
  valeur_invalide:"Valeur invalide.",
  message_vide_bug:"Décris le problème avant d’envoyer.",
  message_vide:"Écris un message avant d’envoyer."
};
function messageErreur(e){
  const m = (e && (e.message || e.error_description || e.msg)) || 'Une erreur est survenue.';
  for (const k in ERREURS) if (m.includes(k)) return ERREURS[k];
  if (m.includes('Invalid login credentials')) return "Email ou mot de passe incorrect.";
  if (m.includes('already registered') || m.includes('already been registered')) return "Un compte existe déjà avec cet email.";
  if (m.includes('Password should be')) return "Le mot de passe doit faire au moins 8 caractères.";
  if (m.includes('Email not confirmed')) return "Ton email n'est pas confirmé. Contacte le cabinet.";
  if (m.includes('duplicate key')) return "Tu es déjà inscrite à ce cours.";
  if (m.includes('rate limit') || m.includes('Too many')) return "Trop de tentatives, réessaie dans quelques minutes.";
  return m;
}
function flash(type, texte){ S.notice = {type, texte}; render(); setTimeout(()=>{ if(S.notice && S.notice.texte===texte){ S.notice=null; render(); } }, 6000); }
/* ------------------------------------------------------------------ données */
async function chargerProfil(){
  const { data } = await sb.from('adherentes').select('*').eq('id', S.session.user.id).maybeSingle();
  S.profil = data || null;
  const p = await sb.from('parametres').select('*').maybeSingle();
  S.params = p.data || { nom_cabinet:'Marine Le Masson', delai_annulation_h:24, message_accueil:'' };
}
async function chargerCreneaux(){
  const { data, error } = await sb.rpc('liste_creneaux', { p_jours: 365 });
  if (error) { flash('err', messageErreur(error)); return; }
  S.creneaux = data || [];
  const p = await sb.rpc('participants_cours', { p_jours: 365 });
  S.participants = {};
  (p.data || []).forEach(x => { (S.participants[x.creneau_id] ||= []).push(x); });
}
function listeParticipants(c){
  const ps = (S.participants || {})[c.id] || [];
  const nom = x => x.moi ? '<b>toi</b>' : esc(x.nom);
  const conf = ps.filter(x => x.statut === 'confirmee'), att = ps.filter(x => x.statut === 'attente');
  return `<button type="button" data-act="voir-participants" data-id="${c.id}" style="all:unset; display:block; cursor:pointer; font-size:12.5px; line-height:1.45; margin-top:4px; color:var(--ink-faint)">
    ${conf.length ? `<span style="color:var(--ink-soft)">Inscrites :</span> ${conf.slice(0,4).map(nom).join(', ')}${conf.length>4?` +${conf.length-4}`:''}` : 'Personne d’inscrit pour l’instant'}
    ${att.length ? `<br><span style="color:var(--ink-soft)">En attente :</span> ${att.length}` : ''}
    <br><span style="color:var(--rose); font-weight:700; text-decoration:underline; text-underline-offset:2px">Voir tout le monde</span></button>`;
}
function feuilleParticipants(c){
  if (!c) return '<div class="faint">Cours introuvable.</div>';
  const ps = (S.participants || {})[c.id] || [];
  const conf = ps.filter(x => x.statut === 'confirmee'), att = ps.filter(x => x.statut === 'attente');
  const libres = Math.max(0, c.capacite - conf.length);
  const ligne = (x, i, rang) => `<div class="person">
      <div class="avatar">${rang ? i+1 : esc((x.nom||'?').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase())}</div>
      <div class="grow"><div class="name">${esc(x.nom)}${x.moi ? ' <span class="badge ok" style="margin-left:6px">toi</span>' : ''}</div></div></div>`;
  return `
    <div class="card stack" style="margin-bottom:14px">
      <div style="font-weight:700">${esc(c.titre)}</div>
      <div class="faint">${conf.length}/${c.capacite} inscrites · ${libres ? `${libres} place${libres>1?'s':''} libre${libres>1?'s':''}` : 'complet'}${att.length ? ` · ${att.length} en attente` : ''}</div>
    </div>
    <div class="section-title">Inscrites · ${conf.length}</div>
    <div class="card">${conf.length ? conf.map((x,i)=>ligne(x,i,false)).join('') : '<div class="faint">Personne pour l’instant.</div>'}</div>
    ${att.length ? `<div class="section-title">Liste d’attente · ${att.length}</div>
      <div class="faint" style="margin:-4px 0 10px">Dans l’ordre d’arrivée : la première récupère la prochaine place libérée.</div>
      <div class="card">${att.map((x,i)=>ligne(x,i,true)).join('')}</div>` : ''}`;
}
async function chargerRappels(){
  const { data } = await sb.from('rappels').select('*').order('cree_le', { ascending:true });
  S.rappels = data || [];
}
const JOURS_C = ['dim','lun','mar','mer','jeu','ven','sam'];
const JOURS_L = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const CIBLES = { toutes:'Toutes les adhérentes', inscrites_demain:'Les inscrites à un cours le lendemain', inscrites_jour:'Les inscrites à un cours le jour même', sans_resa:'Les adhérentes sans aucune réservation à venir' };
function resumeRappel(r){
  const h = String(r.heure||'').slice(0,5).replace(':','h');
  let q = r.repetition === 'quotidien' ? 'Tous les jours'
    : r.repetition === 'hebdo' ? ((r.jours||[]).length ? 'Chaque ' + [...r.jours].sort().map(j=>JOURS_L[j]).join(', ') : 'Aucun jour choisi')
    : r.repetition === 'mensuel' ? `Le ${r.jour_mois} de chaque mois`
    : `Une seule fois, le ${r.date_unique ? fExp(r.date_unique) : '?'}`;
  return `${q} à ${h} · ${CIBLES[r.cible]||r.cible}`;
}
function vueAdminRappels(){
  return `
    <div class="row-between" style="margin-bottom:10px"><div class="faint" style="max-width:62%">Crée autant de rappels que tu veux : message, heure, jours et destinataires.</div>

    ${S.rappels.length ? `<div class="stack">${S.rappels.map(r=>`
      <div class="card stack" style="${r.actif?'':'opacity:.6'}">

        <div class="row" style="flex-wrap:wrap">
          <button class="btn soft xs" data-act="rappel-edit" data-id="${r.id}">Modifier</button>

function formRappel(r){
  r = r || { titre:'', message:'', cible:'toutes', heure:'18:00', repetition:'hebdo', jours:[], jour_mois:1, date_unique:'' };
  const opt = (v, l, cur) => `<option value="${v}" ${v===cur?'selected':''}>${l}</option>`;
  return `<form id="frappel" class="stack" data-id="${r.id||''}">
    <div class="field" style="margin:0"><label for="rp-titre">Titre de la notification</label>
      <input id="rp-titre" name="titre" value="${esc(r.titre)}" required placeholder="Ex. : Ton cours {jour} à {heure} ❤️"></div>
    <div class="field" style="margin:0"><label for="rp-msg">Message</label>
      <textarea id="rp-msg" name="message" rows="5" required placeholder="Hey {prenom} ! …">${esc(r.message)}</textarea>
      <div class="faint" style="margin-top:6px; font-size:12.5px; line-height:1.5">Mots magiques remplacés automatiquement :
        <b>{prenom}</b> · <b>{jour}</b> (demain / aujourd’hui) · <b>{heure}</b> (heure du cours) · <b>{date}</b> · <b>{seances}</b> (séances restantes) · <b>{cours_semaine}</b> (places de la semaine) · <b>{prochains_cours}</b></div></div>
    <div class="field" style="margin:0"><label for="rp-cible">Qui le reçoit</label>
      <select id="rp-cible" name="cible">${Object.entries(CIBLES).map(([v,l])=>opt(v,l,r.cible)).join('')}</select></div>
    <div class="fields-2">
      <div class="field" style="margin:0"><label for="rp-heure">Heure</label>
        <input id="rp-heure" name="heure" type="time" value="${String(r.heure||'18:00').slice(0,5)}" required></div>
      <div class="field" style="margin:0"><label for="rp-rep">Répétition</label>
        <select id="rp-rep" name="repetition" data-act-change="rp-rep">
          ${opt('une_fois','Une seule fois',r.repetition)}${opt('quotidien','Tous les jours',r.repetition)}${opt('hebdo','Certains jours de la semaine',r.repetition)}${opt('mensuel','Une fois par mois',r.repetition)}
        </select></div>
    </div>
    <div data-rep="hebdo" ${r.repetition==='hebdo'?'':'hidden'}><div class="faint" style="margin-bottom:6px">Quels jours ?</div>
      <div class="row" style="flex-wrap:wrap; gap:6px">${[1,2,3,4,5,6,0].map(j=>`<label class="btn soft xs" style="gap:6px"><input type="checkbox" name="j${j}" ${(r.jours||[]).includes(j)?'checked':''}> ${JOURS_C[j]}</label>`).join('')}</div></div>
    <div data-rep="mensuel" class="field" style="margin:0" ${r.repetition==='mensuel'?'':'hidden'}><label for="rp-jm">Jour du mois</label>
      <input id="rp-jm" name="jour_mois" type="number" min="1" max="28" value="${r.jour_mois||1}"></div>
    <div data-rep="une_fois" class="field" style="margin:0" ${r.repetition==='une_fois'?'':'hidden'}><label for="rp-date">Date</label>
      <input id="rp-date" name="date_unique" type="date" value="${r.date_unique||''}" min="${dayKey(new Date())}"></div>
    <button class="btn full" type="submit" ${S.busy?'disabled':''}>${r.id ? 'Enregistrer' : 'Créer le rappel'}</button>
  </form>`;
}

function blocDemandeCliente(){
  const enCours = S.demandes.find(d => d.statut === 'en_attente');
  const passees = S.demandes.filter(d => d.statut !== 'en_attente').slice(0,3);

    : `

      <div class="row-between" style="font-size:14px"><span>${seances(d.nombre)} · ${esc(fDate(new Date(d.cree_le)))}</span>${lib[d.statut]||''}</div>`).join('')}</div>` : ''}

async function chargerLots(){
  const { data } = await sb.from('lots_credits').select('*').gt('restant', 0).order('expire_le', { ascending:true, nullsFirst:false });
  S.lots = data || [];
}
const lotsDe = id => S.lots.filter(l => l.adherente_id === id);
const fExp = k => fDate(dePuisCle(k));

  const ls = lotsDe(id);

  return `<div class="stack" style="gap:4px; width:100%; text-align:left">${ls.map(l => `
    <div class="row-between" style="font-size:14px; gap:8px"><span style="white-space:nowrap">${seances(l.restant)}</span>

        ? `<span class="${l.expire_le ? '' : 'faint'}" style="flex:1; text-align:right">${l.expire_le ? `à utiliser avant le <b>${esc(fExp(l.expire_le))}</b>` : 'sans date limite'}</span>`

async function chargerNotifs(){
  const { data } = await sb.from('notifications').select('*').order('cree_le', { ascending:false }).limit(40);

}
async function chargerVideos(){

async function actualiser(silencieux){
  if (!S.session || !S.profil || S.maj) return;
  S.maj = true;
  if (!silencieux){ S.rafraichit = true; render(); }
  try {
    if (await verifierVersion()) return;
    await chargerProfil();
    const avant = estAdmin() ? { i: S.adherentes.filter(a => a.statut === 'en_attente').length, d: S.demandes.filter(d => d.statut === 'en_attente').length } : null;
    const t = [chargerNotifs()];
    if (S.profil && (S.profil.statut === 'active' || estAdmin())){
      t.push(chargerCreneaux(), chargerAnnonces(), chargerDemandes(), chargerMessages().catch(() => {}));

      else t.push(chargerHistorique(), chargerLots());
      if (estAdmin() || S.profil.acces_videos) t.push(chargerVideos());
      if (S.vue === 'compte') t.push(chargerMouvements());
    }

      try { S.sheet.participants = await rpc('detail_creneau', { p_creneau: S.sheet.id }) || []; } catch {}
      await chargerRelances(S.sheet.id);
    }
    if (S.profil && S.profil.statut === 'active' && !S.canal) abonnerMessages();
    if (avant){
      const i = S.adherentes.filter(a => a.statut === 'en_attente').length - avant.i, d = S.demandes.filter(x => x.statut === 'en_attente').length - avant.d;
      const bouts = [];
      if (i > 0) bouts.push(`${i} nouvelle${i>1?'s':''} inscription${i>1?'s':''} à valider`);
      if (d > 0) bouts.push(`${d} nouvelle${d>1?'s':''} demande${d>1?'s':''} de séances`);
      if (bouts.length) S.nouveautes = '🆕 ' + bouts.join(' et ') + ' — onglet Adhérentes.';
    }

    if (!silencieux) flash('err', 'Impossible d’actualiser. Vérifie ta connexion.');
  } finally {
    S.maj = false; S.rafraichit = false;
  }
  if (S.nouveautes){ const n = S.nouveautes; S.nouveautes = null; if (silencieux && saisieEnCours()) { S.notice = { type:'ok', texte:n }; return; } flash('ok', n); return; }
  if (!silencieux) flash('ok', 'À jour ✓');

}
function initActualisation(){
  if (S.initActu) return; S.initActu = true;
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') actualiser(true); });
  window.addEventListener('focus', () => { if (Date.now() - (S.derniereActu || 0) > 20000) { S.derniereActu = Date.now(); actualiser(true); } });
  setInterval(() => { if (document.visibilityState === 'visible') actualiser(true); }, 60000);
  setInterval(tournerAnnonces, 6500);
  // tirer vers le bas pour actualiser
  const ptr = document.getElementById('ptr'), lab = ptr && ptr.querySelector('span');
  let y0 = null, dy = 0;
  document.addEventListener('touchstart', (e) => {
    if (window.scrollY > 0 || S.sheet || e.touches.length !== 1 || e.target.closest('textarea, select, .sheet')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive:true });
  document.addEventListener('touchmove', (e) => {
    if (y0 === null || !ptr) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0) { ptr.style.transform = ''; return; }
    const d = Math.min(dy, 110);
    ptr.style.transform = `translate(-50%, ${-70 + d}px)`;
    lab.textContent = dy > 80 ? 'Relâche pour actualiser' : 'Tire pour actualiser';
  }, { passive:true });
  document.addEventListener('touchend', async () => {
    if (y0 === null || !ptr) return;
    const ok = dy > 80; y0 = null; dy = 0;
    if (!ok) { ptr.style.transform = ''; return; }
    ptr.classList.add('go'); lab.textContent = 'Actualisation…'; ptr.style.transform = 'translate(-50%, 0)';
    await actualiser(false);
    ptr.classList.remove('go'); ptr.style.transform = '';
  });
}

async function envoyerLogo(fichier){
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(fichier); });
  const cote = 512, s = Math.min(1, cote / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  const chemin = `logo/${Date.now()}.png`;
  const up = await sb.storage.from('avatars').upload(chemin, blob, { contentType:'image/png', upsert:true });
  if (up.error) throw up.error;
  const url = sb.storage.from('avatars').getPublicUrl(chemin).data.publicUrl;
  const { error } = await sb.from('parametres').update({ logo_url: url }).eq('id', true);
  if (error) throw error;
  await chargerProfil();
}

function carteCreneau(c, admin, avecDate){
  const d = new Date(c.debut);
  const fin = new Date(d.getTime() + c.duree_min*60000);
  const libres = Math.max(0, c.capacite - c.places_prises);
  const annule = c.statut === 'annule';
  const passe = d <= new Date();
  const mien = c.mon_statut;

  const pips = Array.from({length:Math.min(c.capacite,12)}, (_,i)=>
    `<i class="pip ${i < c.places_prises ? '' : 'free'}"></i>`).join('');

  let etat;
  if (annule) etat = '<span class="badge off">Cours annulé</span>';
  else if (mien === 'confirmee' && c.a_confirmer) etat = '<span class="badge wait">Place libérée pour toi · à confirmer</span>';
  else if (mien === 'confirmee') etat = '<span class="badge ok">Ta place est réservée</span>';
  else if (mien === 'attente') etat = `<span class="badge wait">Liste d’attente · ${c.ma_position}${c.ma_position===1?'re':'e'}</span>`;
  else if (libres === 0) etat = '<span class="badge neutral">Complet</span>';
  else etat = '';

  let action = '';
  if (admin) {
    action = `<button class="btn soft sm" data-act="detail" data-id="${c.id}">Voir le cours</button>`;
  } else if (!annule && !passe) {
    if (mien === 'confirmee' && c.a_confirmer) action = `<div class="stack" style="gap:6px">
        <button class="btn sm" data-act="confirmer-place" data-id="${c.ma_reservation_id}">Je confirme</button>
        <button class="btn dangerish sm" data-act="refuser-place" data-id="${c.ma_reservation_id}">Je libère</button></div>`;
    else if (mien) action = `<button class="btn dangerish sm" data-act="annuler" data-id="${c.ma_reservation_id}" data-debut="${c.debut}">Annuler</button>`;
    else if (S.profil.credits < 1) action = `<button class="btn soft sm" disabled title="Plus de crédit séance">Plus de crédit</button>`;
    else if (libres > 0) action = `<button class="btn sm" data-act="reserver" data-id="${c.id}">Réserver</button>`;
    else action = `<button class="btn warnish sm" data-act="reserver" data-id="${c.id}">Liste d’attente</button>`;
  }

  return `<div class="slot ${mien==='confirmee'?'mine':''} ${annule||passe?'off':''}">
    <div class="time"><b>${fTime(d)}</b><small>${fTime(fin)}</small></div>
    <div class="slot-body">
      ${avecDate ? `<div style="font-weight:700; color:var(--rose); text-transform:capitalize; margin-bottom:2px">${esc(fDay(d))}</div>` : ''}
      <div class="slot-title">${esc(c.titre)}${c.lieu?` <span class="faint" style="font-weight:400">· ${esc(c.lieu)}</span>`:''}</div>
      <div class="seats"><span class="pips">${pips}</span>
        ${annule ? '—' : `${c.places_prises}/${c.capacite}${libres>0?` · ${libres} place${libres>1?'s':''} libre${libres>1?'s':''}`:''}`}
        ${c.nb_attente>0 ? ` · ${c.nb_attente} en attente` : ''}
      </div>
      ${c.note ? `<div class="faint">${esc(c.note)}</div>` : ''}
      ${!admin && !annule && !passe ? listeParticipants(c) : ''}
      ${!annule && !passe && (S.params.min_participants||0) > 0 && c.places_prises < S.params.min_participants
        ? `<div class="faint">Minimum ${S.params.min_participants} inscrites, sinon le cours est annulé</div>` : ''}
      ${!admin && mien && !annule && !passe ? blocBesoin(c) : ''}
      ${admin ? boiteSuggestions(c) : ''}
      ${etat}
    </div>
    ${action ? `<div style="align-self:center">${action}</div>` : ''}
  </div>`;
}

  if (!liste.length) return `<div class="empty">${ICO.empty}<div>Aucun cours programmé pour le moment.</div></div>`;
  const groupes = {};
  liste.forEach(c => { const k = dayKey(new Date(c.debut)); (groupes[k] ||= []).push(c); });
  const auj = dayKey(new Date());
  const demain = dayKey(new Date(Date.now()+864e5));
  return Object.keys(groupes).sort().map(k => {
    const d = new Date(groupes[k][0].debut);
    const label = k===auj ? "Aujourd'hui" : k===demain ? 'Demain' : fDay(d);
    return `<div class="day"><strong>${esc(label)}</strong><span>${k===auj||k===demain?fDay(d):''}</span></div>
      <div class="stack">${groupes[k].map(c=>carteCreneau(c, admin)).join('')}</div>`;
  }).join('');
}

async function envoyerPhoto(fichier, id){
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(fichier); });
  const cote = 480, s = Math.min(1, cote / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
  const chemin = `${id}/${Date.now()}.jpg`;
  const up = await sb.storage.from('avatars').upload(chemin, blob, { contentType:'image/jpeg', upsert:true });
  if (up.error) throw up.error;
  const url = sb.storage.from('avatars').getPublicUrl(chemin).data.publicUrl;
  const { error } = await sb.from('adherentes').update({ photo_url: url }).eq('id', id);
  if (error) throw error;
}

function calendrier(){
  const an = S.mois.getFullYear(), mo = S.mois.getMonth();

  const nbJours = new Date(an, mo+1, 0).getDate();
  const auj = dayKey(new Date());

  const parJour = {};
  S.creneaux.forEach(c => { const k = dayKey(new Date(c.debut)); (parJour[k] ||= []).push(c); });

  const cases = [];
  for (let i=0; i<decal; i++) cases.push('<div class="jour vide"></div>');
  for (let j=1; j<=nbJours; j++){
    const k = dayKey(new Date(an, mo, j));

function invitationPush(){

  let plusTard = 0; try { plusTard = Number(localStorage.getItem('push_plus_tard') || 0); } catch {}
  if (Date.now() - plusTard < 3*864e5) return '';
  const ok = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  if (ok && Notification.permission === 'denied') return '';
  return `<div class="card stack" style="border:2px solid var(--rose-vif); margin-bottom:14px">

      <button class="btn ghost sm" data-act="push-plus-tard">Plus tard</button></div>

async function etatPush(){
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    S.pushActif = !!sub && Notification.permission === 'granted';
    if (S.pushActif) await enregistrerAbonnement(sub);
  } catch {}
}
function b64ToU8(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c=>c.charCodeAt(0)); }
async function enregistrerAbonnement(sub){
  const j = sub.toJSON();
  await sb.from('push_abonnements').upsert({ adherente_id: S.profil.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
}
async function activerPush(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications refusées. Tu peux les autoriser dans les réglages du téléphone.');
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
  await enregistrerAbonnement(sub);
  S.pushActif = true;
}

function lecteurVideo(lien){
  const l = String(lien||'').trim();
  let m = l.match(/(?:youtu\.be\/|[?&]v=|shorts\/|live\/|embed\/)([\w-]{11})/);
  if (/youtu/.test(l) && m) return `<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen title="Vidéo du cours"></iframe></div>`;
  m = l.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
  if (m) return `<div class="video-frame"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen title="Vidéo du cours"></iframe></div>`;
  if (/\.(mp4|mov|webm|m4v)(\?|$)/i.test(l)) return `<video class="video-frame" src="${esc(l)}" controls playsinline preload="metadata"></video>`;
  return `<a class="btn full" href="${esc(l)}" target="_blank" rel="noopener">Ouvrir la vidéo</a>`;
}

/* ---------------------------------------------------------- feuilles (modales) */
function feuille(){
  let titre = '', corps = '';
  if (S.sheet.type === 'nouveau'){ titre = 'Nouveau cours'; corps = formNouveauCreneau(); }
  if (S.sheet.type === 'notifs'){ titre = 'Notifications'; corps = listeNotifs(); }
  if (S.sheet.type === 'menu'){ titre = 'Menu'; corps = feuilleMenu(); }
  if (S.sheet.type === 'bug'){ titre = estAdmin() ? 'Bugs signalés' : 'Signaler un bug'; corps = feuilleBug(); }
  if (S.sheet.type === 'annuler'){ const c = S.creneaux.find(x=>x.id===S.sheet.id);
    titre = 'Annuler le cours'; corps = feuilleAnnuler(c); }
  if (S.sheet.type === 'besoin'){ const c = S.creneaux.find(x=>x.id===S.sheet.id);
    titre = c ? `Cours du ${fCourt(new Date(c.debut))} · ${fTime(new Date(c.debut))}` : 'Mon besoin'; corps = feuilleBesoin(c); }
  if (S.sheet.type === 'rappel'){ const r = S.rappels.find(x=>x.id===S.sheet.id); titre = r ? 'Modifier le rappel' : 'Nouveau rappel'; corps = formRappel(r); }
  if (S.sheet.type === 'participants'){ const c = S.creneaux.find(x=>x.id===S.sheet.id);
    titre = c ? `${fDay(new Date(c.debut)).replace(/^./, x=>x.toUpperCase())} · ${fTime(new Date(c.debut))}` : 'Participantes'; corps = feuilleParticipants(c); }
  if (S.sheet.type === 'detail'){  const c = S.creneaux.find(x=>x.id===S.sheet.id);
    titre = c ? `${fDay(new Date(c.debut))} · ${fTime(new Date(c.debut))}` : 'Cours'; corps = detailCreneau(c); }
  if (S.sheet.type === 'adherente'){ const a = S.adherentes.find(x=>x.id===S.sheet.id);
    titre = a ? `${a.prenom} ${a.nom}` : 'Adhérente'; corps = detailAdherente(a); }
  return `<div class="sheet-bg" data-act="fermer-bg"><div class="sheet">
    <div class="sheet-head"><h2>${esc(titre)}</h2><button class="x" data-act="fermer" aria-label="Fermer">✕</button></div>
    ${S.notice ? `<div class="notice ${S.notice.type}">${esc(S.notice.texte)}</div>` : ''}
    ${corps}
  </div></div>`;
}

function detailCreneau(c){
  if (!c) return '<div class="faint">Cours introuvable.</div>';
  const parts = S.sheet.participants;
  if (!parts) return '<div class="loading">Chargement…</div>';
  const conf = parts.filter(p=>p.statut==='confirmee');
  const att  = parts.filter(p=>p.statut==='attente');
  const libres = Math.max(0, c.capacite - conf.length);
  const passe = new Date(c.debut) <= new Date();
  const dispo = S.adherentes.filter(a=>a.role!=='admin' && a.statut==='active' && !parts.some(p=>p.adherente_id===a.id));

  const ligne = p => `<div class="person">
      <div class="avatar">${esc(((p.prenom||' ')[0]+(p.nom||' ')[0]).toUpperCase())}</div>
      <div class="grow"><div class="name">${esc(p.prenom)} ${esc(p.nom)}</div>
        <div class="faint">${p.telephone ? telLien(p.telephone) + ' · ' : ''}${seances(p.credits)} restante${p.credits>1?'s':''}${p.a_confirmer?' · <b>doit confirmer</b>':''}</div>
        ${(p.besoin||'').trim() ? `<div style="margin-top:6px; font-size:13.5px; line-height:1.45; background:var(--rose-soft); color:var(--rose); padding:8px 11px; border-radius:var(--radius-sm)"><b style="font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:2px">Son besoin</b>${esc(p.besoin)}</div>` : ''}</div>
      ${passe && p.statut==='confirmee' ? `
        <button class="btn ${p.presence==='presente'?'':'soft'} xs" data-act="presence" data-id="${p.reservation_id}" data-val="presente">Présente</button>
        <button class="btn ${p.presence==='absente'?'warnish':'soft'} xs" data-act="presence" data-id="${p.reservation_id}" data-val="absente">Absente</button>`
      : p.statut==='attente'
        ? `<button class="btn xs" data-act="accepter-attente" data-id="${p.reservation_id}">Ajouter</button>
           <button class="btn dangerish xs" data-act="refuser-attente" data-id="${p.reservation_id}">Refuser</button>`
        : `<button class="btn soft xs" data-act="retirer" data-id="${p.reservation_id}">Retirer</button>`}
    </div>`;

  return `
    <div class="card stack" style="margin-bottom:16px">
      <div class="row-between"><div><div style="font-weight:700">${esc(c.titre)}</div>
        <div class="faint">${conf.length}/${c.capacite} inscrites${att.length?` · ${att.length} en attente`:''}${c.lieu?` · ${esc(c.lieu)}`:''}</div></div>
        ${c.statut==='annule'?'<span class="badge off">Annulé</span>':''}</div>
      <div class="field" style="margin:0"><label for="d-cap">Nombre de places</label>
        <div class="row"><input id="d-cap" type="number" min="1" max="40" value="${c.capacite}" style="width:90px">
        <button class="btn soft sm" data-act="capacite" data-id="${c.id}">Mettre à jour</button></div></div>
    </div>

    <div class="section-title">Inscrites · ${conf.length}</div>
    <div class="card">${conf.length ? conf.map(ligne).join('') : '<div class="faint">Personne pour l’instant.</div>'}</div>

    ${att.length ? `<div class="section-title">Liste d’attente · ${att.length}</div>
      <div class="faint" style="margin:-4px 0 10px">« Ajouter » l’inscrit tout de suite, même si le cours est complet (une séance est décomptée). Sinon, la première de la liste récupère automatiquement la prochaine place libérée et doit confirmer sa présence.</div>
      <div class="card">${att.map(ligne).join('')}</div>` : ''}

    ${c.statut==='ouvert' && !passe ? `
      <div class="section-title">Ajouter quelqu’un</div>
      <div class="card"><div class="row">
        <select id="d-add" class="grow"><option value="">Choisir une adhérente…</option>
          ${dispo.map(a=>`<option value="${a.id}">${esc(a.prenom)} ${esc(a.nom)} — ${seances(a.credits)}</option>`).join('')}</select>
        <button class="btn sm" data-act="inscrire" data-id="${c.id}">Inscrire</button>
      </div>
      <div class="faint" style="margin-top:9px">${libres>0 ? `${libres} place${libres>1?'s':''} libre${libres>1?'s':''} — sinon la personne ira en liste d’attente.` : 'Le cours est complet : la personne ira en liste d’attente.'}</div></div>

      ${blocNonInscrites(c, dispo, libres)}

      <div style="margin-top:22px"><button class="btn dangerish full" data-act="annuler-cours" data-id="${c.id}">Annuler ce cours et rendre les séances</button></div>` : ''}`;
}

function blocNonInscrites(c, dispo, libres){
  if (!dispo.length) return `<div class="section-title">Pas inscrites</div><div class="card faint">Toutes les adhérentes actives sont déjà inscrites ou en attente 🎉</div>`;
  const rel = (S.sheet && S.sheet.relances) || {};
  const quand = t => { const d = new Date(t); return dayKey(d) === dayKey(new Date()) ? `aujourd’hui ${fTime(d)}` : `le ${fCourt(d)} ${fTime(d)}`; };
  return `<div class="section-title">Pas inscrites · ${dispo.length}</div>
    <div class="faint" style="margin:-4px 0 10px; line-height:1.45">Adhérentes actives qui ne sont ni inscrites ni en attente pour ce cours. Coche celles à prévenir et envoie-leur une notification.</div>
    <div class="card">
      <label style="display:flex; gap:8px; align-items:center; font-weight:700; font-size:14px; padding-bottom:8px; border-bottom:1px solid var(--line); cursor:pointer">
        <input type="checkbox" id="rel-tout" checked style="width:auto; flex:none"> Tout sélectionner (${dispo.length})</label>
      ${dispo.map(a => `<label class="person" style="cursor:pointer">
        <input type="checkbox" class="rel-sel" value="${a.id}" checked style="width:auto; flex:none">
        ${avatar(a)}
        <div class="grow"><div class="name">${esc(a.prenom)} ${esc(a.nom)}</div>
          <div class="faint">${a.telephone ? telLien(a.telephone) + ' · ' : ''}<span style="${a.credits < 1 ? 'color:var(--danger); font-weight:700' : ''}">${seances(a.credits)}</span>${rel[a.id] ? ` · <span style="color:var(--ok)">✓ notifiée ${quand(rel[a.id])}</span>` : ''}</div></div>
      </label>`).join('')}
    </div>
    <div class="card stack" style="margin-top:10px">
      <div class="field" style="margin:0"><label for="rel-modele">Message à envoyer</label>
        <select id="rel-modele">
          <option value="__places">📣 Places disponibles (message proposé)</option>
          ${(S.rappels || []).map(r => `<option value="${r.id}">🔔 Rappel : ${esc(r.titre)}</option>`).join('')}
          <option value="__libre">✏️ Écrire mon propre message</option>
        </select></div>
      <div class="field" style="margin:0"><label for="rel-titre">Titre de la notification</label>
        <input id="rel-titre" value="${esc(MSG_PLACES.titre)}" maxlength="120"></div>
      <div class="field" style="margin:0"><label for="rel-msg">Message</label>
        <textarea id="rel-msg" rows="4" maxlength="1000">${esc(MSG_PLACES.message)}</textarea>
        <div class="faint" style="margin-top:6px; font-size:12.5px; line-height:1.45">Remplacés automatiquement : <b>{prenom}</b>, <b>{jour}</b> (${esc(fDay(new Date(c.debut)))}), <b>{heure}</b>, <b>{places}</b> (${libres} en ce moment), <b>{seances}</b> (ses séances restantes).</div></div>
      <button class="btn full" data-act="relancer" data-id="${c.id}" ${S.busy ? 'disabled' : ''}>📣 Notifier les adhérentes cochées</button>
    </div>`;
}
async function chargerBugs(){
  const { data } = await sb.from('bugs').select('*').order('cree_le', { ascending:false }).limit(100);
  S.bugs = data || [];
}
function feuilleBug(){
  const admin = estAdmin();
  const liste = S.bugs || [];
  const form = `<form id="fbug" class="card stack">
      <div class="faint" style="line-height:1.5">Un bouton qui ne marche pas, un affichage bizarre, une notification qui n’arrive pas… Décris ce qui s’est passé, on corrige.</div>
      <div class="field" style="margin:0"><label for="bg-txt">Ce qui ne va pas</label>
        <textarea id="bg-txt" name="texte" rows="4" maxlength="1000" placeholder="Ex. : quand je touche « Réserver » sur le cours de lundi, rien ne se passe" required></textarea></div>

  return `${form}

async function chargerRelances(creneau){
  try {
    const { data } = await sb.from('relances_cours').select('adherente_id,le').eq('creneau_id', creneau);
    if (S.sheet && S.sheet.id === creneau) S.sheet.relances = Object.fromEntries((data || []).map(x => [x.adherente_id, x.le]));
  } catch {}
}
const ETATS = {
  venue:['Présente','ok',''], reserve:['Réservé','ok',''], a_confirmer:['À confirmer','wait',''],
  annule_temps:['Annulé à temps','neutral','séance rendue'], annule_tard:['Annulé tard','off','séance perdue'],
  absente:['Absente','off','séance perdue'], attente:['En attente','wait',''],
  attente_retiree:['Sortie de l’attente','neutral',''], cours_annule:['Cours annulé','neutral','annulé par Marine · séance rendue']
};
function blocHistorique(){
  const h = S.sheet && S.sheet.histo;
  if (!h) return '<div class="section-title">Historique</div><div class="loading">Chargement…</div>';
  const s = h.stats, onglet = S.sheet.hOnglet || 'cours';
  const tuile = (n, l) => `<div class="card" style="padding:10px; text-align:center; margin:0"><div style="font-family:Fraunces,serif; font-size:24px; font-weight:600; color:var(--accent)">${n}</div><div class="faint" style="font-size:12px">${l}</div></div>`;
  const FILTRES = { presente:['venue'], loupe:['absente'], annule:['annule_temps','annule_tard'] };
  const filtre = S.sheet.hFiltre || '';
  const listeCours = filtre ? h.cours.filter(c => FILTRES[filtre].includes(c.etat)) : h.cours;
  const cours = listeCours.length ? listeCours.map(c => { const [lib, cls, note] = ETATS[c.etat] || [c.etat,'neutral',''], d = new Date(c.debut);
      return `<div class="hist"><div class="grow"><span style="text-transform:capitalize">${esc(fDay(d))}</span> · ${fTime(d)}
        <div class="faint">Réservé le ${esc(fCourt(new Date(c.reserve_le)))}${note ? ' · '+note : ''}</div></div><span class="badge ${cls}" style="flex:none">${lib}</span></div>`; }).join('')
    : `<div class="faint">${filtre ? 'Aucun cours dans cette catégorie.' : 'Aucun cours pour l’instant.'}</div>`;
  const mouv = h.mouvements.length ? h.mouvements.map(m => {
      const cls = m.delta>0?'plus':m.delta<0?'minus':'zero', val = m.delta>0?`+${m.delta}`:m.delta<0?`${m.delta}`:'0';
      return `<div class="hist"><div class="grow">${esc(m.motif)}<div class="faint">${esc(fDate(new Date(m.le)))} · ${fTime(new Date(m.le))}</div></div><div class="delta ${cls}">${val}</div></div>`; }).join('')
    : '<div class="faint">Aucun mouvement.</div>';
  return `<div class="section-title">Historique</div>
    ${(() => {
      const pres = s.venue||0, loupe = s.absente||0, tard = s.annule_tard||0, annule = (s.annule_temps||0) + tard;
      const base = pres + loupe + tard, taux = base ? Math.round(pres * 100 / base) : null;
      const gros = (k, n, l, sous, coul, fond) => `<button type="button" data-act="h-filtre" data-v="${k}" style="all:unset; box-sizing:border-box; cursor:pointer; text-align:center; padding:12px 6px; border-radius:var(--radius); background:${fond}; border:2px solid ${filtre===k ? coul : 'transparent'}">
          <div style="font-family:Fraunces,serif; font-size:30px; font-weight:600; line-height:1; color:${coul}">${n}</div>
          <div style="font-size:13px; font-weight:700; color:${coul}; margin-top:5px">${l}</div>
          <div class="faint" style="font-size:11px; margin-top:2px; min-height:13px">${sous}</div></button>`;
      return `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px">
          ${gros('presente', pres, 'Présente ✅', 'cours suivis', 'var(--ok)', 'var(--ok-soft)')}
          ${gros('loupe', loupe, loupe>1?'Loupés ❌':'Loupé ❌', 'absente sans prévenir', 'var(--danger)', 'var(--danger-soft)')}
          ${gros('annule', annule, annule>1?'Annulés 🚫':'Annulé 🚫', tard ? `dont ${tard} hors délai` : 'à temps', 'var(--warn)', 'var(--warn-soft)')}
        </div>
        <div class="faint" style="font-size:12.5px; text-align:center; margin-bottom:12px; line-height:1.5">
          ${taux !== null ? `Assiduité <b style="color:var(--ink)">${taux} %</b> · ` : ''}${s.reserve||0} à venir${s.attente ? ` · ${s.attente} en attente` : ''}${s.cours_annule ? ` · ${s.cours_annule} cours annulé${s.cours_annule>1?'s':''} par Marine` : ''}
          <br>Touchez une case pour voir le détail.${filtre ? ` <button class="linkish" data-act="h-filtre" data-v="" style="font-size:12.5px">Tout afficher</button>` : ''}</div>`;
    })()}
    <div style="display:flex; gap:6px; margin-bottom:10px">
      <button class="btn ${onglet==='cours'?'':'soft'} sm grow" data-act="h-onglet" data-v="cours">Cours (${listeCours.length})</button>
      <button class="btn ${onglet==='seances'?'':'soft'} sm grow" data-act="h-onglet" data-v="seances">Séances (${h.mouvements.length})</button>
    </div>
    <div class="card">${onglet==='cours' ? cours : mouv}</div>`;
}

      <div class="row-between"><span class="muted">Téléphone</span><span>${telLien(a.telephone)}</span></div>

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'fermer-bg' && e.target !== el) return;

  switch(act){
    case 'mode': S.authMode = el.dataset.mode; S.notice=null; render(); break;
    case 'vue': if (el.dataset.vue === 'messages') { ouvrirMessages(); break; } S.vue = el.dataset.vue; S.notice=null; render(); if(S.vue==='compte') Promise.all([chargerMouvements(), chargerLots(), chargerDemandes()]).then(render); if(S.vue==='adherentes') chargerDemandes().then(render); if(S.vue==='mes') chargerHistorique().then(render); if(S.vue==='videos') chargerVideos().then(render); if(S.vue==='rappels') chargerRappels().then(render); break;
    case 'fermer': case 'fermer-bg': S.sheet = null; render(); break;
    case 'deconnexion': await sb.auth.signOut(); S.session=null; S.profil=null; render(); break;
    case 'rafraichir': await agir(async()=>{ await chargerProfil(); await chargerCreneaux(); await chargerAnnonces(); }); break;

    case 'planning-vue': S.planningVue = el.dataset.v; render(); break;
    case 'cours-vue': {
      S.coursVue = el.dataset.v;
      if (S.coursVue === 'calendrier' && !S.jourSel){
        const p = S.creneaux.filter(c => c.statut === 'ouvert' && new Date(c.debut) > new Date())
          .sort((a,b) => new Date(a.debut) - new Date(b.debut))[0];
        if (p) { S.jourSel = dayKey(new Date(p.debut)); S.mois = new Date(new Date(p.debut).getFullYear(), new Date(p.debut).getMonth(), 1); }
      }
      render(); break;
    }
    case 'mois': {
      const pas = Number(el.dataset.pas);
      S.mois = new Date(S.mois.getFullYear(), S.mois.getMonth() + pas, 1);
      render(); break;
    }
    case 'jour': S.jourSel = (S.jourSel === el.dataset.jour) ? null : el.dataset.jour; render(); break;

    case 'sheet': {
      S.sheet = { type: el.dataset.sheet, id: el.dataset.id, date: el.dataset.date }; render();
      if (S.sheet.type === 'adherente') {
        const [, h] = await Promise.all([chargerAdherentes(), rpc('admin_historique', { p_adh: el.dataset.id }).catch(()=>null)]);
        if (S.sheet) S.sheet.histo = h || { stats:{venue:0,reserve:0,annule_temps:0,annule_tard:0,absente:0,attente:0}, cours:[], mouvements:[] };
      }
      render(); break;
    }
    case 'detail': await agir(async()=>{
      S.sheet = { type:'detail', id: el.dataset.id, participants:null };
      render();
      const [p] = await Promise.all([ rpc('detail_creneau',{p_creneau: el.dataset.id}), chargerAdherentes(),
        chargerRelances(el.dataset.id), (S.rappels && S.rappels.length) ? null : chargerRappels() ]);
      S.sheet.participants = p || [];
    }); break;

    case 'reserver': if (S.profil.credits < 1) { flash('err','Il ne te reste plus aucun crédit séance. Contacte Marine pour en rajouter.'); break; }
    await agir(async()=>{
      const r = await rpc('reserver', { p_creneau: el.dataset.id });
      await Promise.all([chargerProfil(), chargerCreneaux(), chargerLots()]);
      flash('ok', r.statut === 'confirmee'
        ? `C’est réservé ! 1 crédit séance décompté, il t’en reste ${S.profil.credits}.`
        : 'Le cours est complet : tu es en liste d’attente. Si une place se libère, tu seras inscrite automatiquement et prévenue. Aucune séance décomptée pour l’instant.');
      S.sheet = { type:'besoin', id: el.dataset.id };
    }); break;

    case 'annuler': {
      const debut = new Date(el.dataset.debut);
      const limite = new Date(debut.getTime() - S.params.delai_annulation_h*3600000);
      const tard = new Date() >= limite;
      if (!confirm(tard
        ? `Il reste moins de ${S.params.delai_annulation_h} h avant le cours : la séance sera décomptée quand même. Annuler ?`
        : 'Annuler cette réservation ? La séance te sera rendue.')) break;
      await agir(async()=>{
        const r = await rpc('annuler', { p_reservation: el.dataset.id });
        await Promise.all([chargerProfil(), chargerCreneaux()]);
        flash(r.rembourse?'ok':'err', r.rembourse ? `Réservation annulée, crédit séance rendu. Il t’en reste ${S.profil.credits}.` : `Réservation annulée — le crédit séance a été décompté. Il t’en reste ${S.profil.credits}.`);
      }); break;
    }

    case 'statut': await agir(async()=>{
      const { error } = await sb.from('adherentes').update({statut: el.dataset.val}).eq('id', el.dataset.id);
      if (error) throw error;
      await chargerAdherentes(); if (S.sheet) S.sheet = null;

    case 'acces-video': await agir(async()=>{
      const ouvrir = el.dataset.val === '1';

      if (error) throw error;

    case 'suppr-video': {
      if (!confirm('Retirer cette vidéo maintenant ?')) break;
      await agir(async()=>{
        const { error } = await sb.from('videos').delete().eq('id', el.dataset.id);
        if (error) throw error;
        await chargerVideos(); flash('ok','Vidéo retirée.');
      }); break;
    }

    case 'notifs': {
      S.sheet = { type:'notifs' }; render();
      await chargerNotifs(); render();
      if (S.notifs.some(n=>!n.lu)) {
        await sb.from('notifications').update({ lu:true }).eq('lu', false).eq('destinataire', S.profil.id);
        setTimeout(async()=>{ await chargerNotifs(); render(); }, 2500);
      }
      break;
    }
    case 'push-plus-tard': try { localStorage.setItem('push_plus_tard', String(Date.now())); } catch {} render(); break;
    case 'push-on': await agir(async()=>{ await activerPush(); flash('ok','Notifications activées sur ce téléphone.'); }); break;
    case 'push-test': await agir(async()=>{
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification('Marine Le Masson', { body:'Les notifications fonctionnent sur ce téléphone.', icon:'icon-192.png' });
    }); break;

    case 'refuser': {
      if (!confirm('Refuser cette demande d’inscription ? La personne ne pourra pas réserver.')) break;
      await agir(async()=>{
        const { error } = await sb.from('adherentes').update({statut:'refuse'}).eq('id', el.dataset.id);
        if (error) throw error;
        await chargerAdherentes(); flash('ok','Demande refusée.');
      }); break;

    case 'credits': await agir(async()=>{
      const n = Number(el.dataset.n); const exp = n > 0 ? ($('#ad-exp')?.value || null) : null;
      await rpc('admin_ajouter_credits', { p_adherente: el.dataset.id, p_nb: n, p_motif: '', p_expire: exp });
      await Promise.all([chargerAdherentes(), chargerCreneaux()]);
      flash('ok','Séances mises à jour.');

    case 'credits-tout': {
      const a = S.adherentes.find(x=>x.id===el.dataset.id);
      if (!a || a.credits < 1 || !confirm(`Retirer les ${seances(a.credits)} de ${a.prenom} ?`)) break;
      await agir(async()=>{
        await rpc('admin_ajouter_credits', { p_adherente: a.id, p_nb: -a.credits, p_motif: '', p_expire: null });
        await Promise.all([chargerAdherentes(), chargerCreneaux()]);
        flash('ok','Séances retirées.');
      }); break;
    }
    case 'voir-participants': S.sheet = { type:'participants', id: el.dataset.id }; render(); break;
    case 'rappel-edit': S.sheet = { type:'rappel', id: el.dataset.id || null }; render(); break;
    case 'rappel-toggle': await agir(async()=>{
      const r = S.rappels.find(x=>x.id===el.dataset.id);
      const { error } = await sb.from('rappels').update({ actif: !r.actif }).eq('id', r.id);
      if (error) throw error; await chargerRappels(); flash('ok', r.actif ? 'Rappel mis en pause.' : 'Rappel activé.');
    }); break;
    case 'rappel-suppr': {
      if (!confirm('Supprimer ce rappel ?')) break;

        const { error } = await sb.from('rappels').delete().eq('id', el.dataset.id);
        if (error) throw error; await chargerRappels(); flash('ok','Rappel supprimé.');
      }); break;

      await chargerNotifs(); flash('ok','Test envoyé : regarde la cloche (et ton téléphone si les notifications sont activées).');
    }); break;
    case 'conv': S.conv = el.dataset.conv; marquerLu(S.conv); S.scrollBas = true; render(); break;
