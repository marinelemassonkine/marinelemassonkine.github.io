    case 'besoin': S.sheet = { type:'besoin', id: el.dataset.id }; render(); break;
    case 'besoin-effacer': await agir(async()=>{
      await rpc('maj_besoin', { p_creneau: el.dataset.id, p_texte: '' });
      await chargerCreneaux(); S.sheet = null; flash('ok','Besoin effacé.');
    }); break;
    case 'menu': S.sheet = { type:'menu' }; render(); break;
    case 'menu-vers': { const v = el.dataset.vue; S.sheet = null; if (v === 'messages') { ouvrirMessages(); break; } S.vue = v; S.notice = null; render();
      if (v==='compte') Promise.all([chargerMouvements(), chargerLots(), chargerDemandes()]).then(render);
      if (v==='adherentes') chargerDemandes().then(render);
      if (v==='mes') chargerHistorique().then(render);
      if (v==='videos') chargerVideos().then(render);
      if (v==='rappels') chargerRappels().then(render);
      window.scrollTo(0,0); break; }
    case 'menu-notifs': S.sheet = { type:'notifs' }; render(); sb.from('notifications').update({lu:true}).eq('lu',false).then(()=>chargerNotifs().then(render)); break;
    case 'suppr-adherente': {
      const nom = el.dataset.nom || 'cette adhérente';
      if (!confirm(`Supprimer définitivement ${nom} ?\n\nSes séances, son historique et ses messages seront effacés. C’est irréversible.`)) break;
      if (!confirm(`Dernière vérification : on supprime bien ${nom} ?`)) break;
      await agir(async()=>{
        await rpc('admin_supprimer_adherente', { p_adh: el.dataset.id });
        S.sheet = null;
        await Promise.all([chargerAdherentes(), chargerCreneaux(), chargerMessages().catch(()=>{})]);
        flash('ok', `${nom} a été supprimée.`);
      }); break;
    }
    case 'menu-bug': S.sheet = { type:'bug' }; render(); chargerBugs().then(render); break;
    case 'bug-statut': await agir(async()=>{
      const { error } = await sb.from('bugs').update({ statut: el.dataset.val }).eq('id', el.dataset.id);
      if (error) throw error;
      await chargerBugs();
    }); break;
    case 'menu-actualiser': S.sheet = null; render(); actualiser(false); break;
    case 'actualiser': actualiser(false); break;
    case 'recharger': recharger(); break;
    case 'h-onglet': if (S.sheet) { S.sheet.hOnglet = el.dataset.v; render(); } break;
    case 'suppr-lot': {
      if (!confirm('Retirer ces séances du compte de la cliente ?')) break;
      await agir(async()=>{
        await rpc('admin_supprimer_lot', { p_lot: el.dataset.id });
        await Promise.all([chargerAdherentes(), chargerCreneaux()]);
        flash('ok','Séances retirées.');
      }); break;
    }
    case 'credits-libre': {
      const n = Math.abs(Number($('#ad-n')?.value || 0)) * Number(el.dataset.sens || 1);
      if (!n) { flash('err','Indique un nombre.'); break; }
      await agir(async()=>{
        await rpc('admin_ajouter_credits', { p_adherente: el.dataset.id, p_nb: n, p_motif: '', p_expire: n > 0 ? ($('#ad-exp')?.value || null) : null });
        await Promise.all([chargerAdherentes(), chargerCreneaux()]);
        flash('ok','Séances mises à jour.');
      }); break;
    }

    case 'suppr-annonce': await agir(async()=>{
      const { error } = await sb.from('annonces').delete().eq('id', el.dataset.id);
      if (error) throw error;
      await chargerAnnonces(); flash('ok','Annonce retirée.');
    }); break;
    case 'inscrire': {
      const who = $('#d-add')?.value;
      if (!who) { flash('err','Choisis une adhérente.'); break; }
      await agir(async()=>{
        await rpc('admin_inscrire', { p_creneau: el.dataset.id, p_adherente: who, p_forcer: false });
        const [p] = await Promise.all([ rpc('detail_creneau',{p_creneau: el.dataset.id}), chargerCreneaux(), chargerAdherentes() ]);
        S.sheet.participants = p || [];
        flash('ok','Inscription enregistrée.');
      }); break;
    }

    case 'retirer': await agir(async()=>{
      await rpc('annuler', { p_reservation: el.dataset.id });
      const [p] = await Promise.all([ rpc('detail_creneau',{p_creneau: S.sheet.id}), chargerCreneaux(), chargerAdherentes() ]);
      S.sheet.participants = p || [];
      flash('ok','Retirée du cours, séance rendue.');
    }); break;

    case 'confirmer-place': await agir(async()=>{
      await rpc('confirmer_place', { p_reservation: el.dataset.id });
      await chargerCreneaux(); flash('ok','Merci ! Ta présence est confirmée.');
    }); break;
    case 'refuser-place': {
      if (!confirm('Libérer cette place ? Ton crédit séance te sera rendu et la place ira à la personne suivante.')) break;
      await agir(async()=>{
        await rpc('refuser_place', { p_reservation: el.dataset.id });
        await Promise.all([chargerProfil(), chargerCreneaux()]);
        flash('ok', `Place libérée, crédit séance rendu. Il t’en reste ${S.profil.credits}.`);
      }); break;
    }

    case 'dm-nb': { const i = $('#dm-nb'); if (i) i.value = el.dataset.n; break; }
    case 'demande-annuler': await agir(async()=>{
      await rpc('annuler_demande', { p_id: el.dataset.id });
      await chargerDemandes(); flash('ok','Demande annulée.');
    }); break;
    case 'demande-ok': {
      const d = S.demandes.find(x=>x.id===el.dataset.id);
      const exp = $('#dm-exp-'+el.dataset.id)?.value || null;
      if (!confirm(`Confirmer que ${d ? seances(d.nombre) : 'ces séances'} ${d && d.nombre>1 ? 'ont été réglées' : 'a été réglée'} ? Elles seront ajoutées tout de suite.`)) break;
      await agir(async()=>{
        await rpc('admin_traiter_demande', { p_id: el.dataset.id, p_accepter: true, p_expire: exp });
        await Promise.all([chargerDemandes(), chargerAdherentes()]);
        flash('ok','Séances ajoutées. La cliente est prévenue.');
      }); break;
    }
    case 'demande-non': {
      if (!confirm('Refuser cette demande ? La cliente sera prévenue.')) break;
      await agir(async()=>{
        await rpc('admin_traiter_demande', { p_id: el.dataset.id, p_accepter: false, p_expire: null });
        await chargerDemandes(); flash('ok','Demande refusée.');
      }); break;
    }

    case 'accepter-attente': {
      const c = S.creneaux.find(x=>x.id===S.sheet.id);
      const nbConf = (S.sheet.participants||[]).filter(p=>p.statut==='confirmee').length;
      if (c && nbConf >= c.capacite && !confirm(`Le cours est complet (${nbConf}/${c.capacite}). L’ajouter quand même en plus ?`)) break;
      await agir(async()=>{
        await rpc('admin_accepter_attente', { p_reservation: el.dataset.id });
        const [p] = await Promise.all([ rpc('detail_creneau',{p_creneau: S.sheet.id}), chargerCreneaux(), chargerAdherentes() ]);
        S.sheet.participants = p || [];
        flash('ok','Ajoutée au cours. Elle est prévenue et une séance a été décomptée.');
      }); break;
    }
    case 'refuser-attente': {
      if (!confirm('Refuser cette demande ? La personne sera prévenue, aucune séance décomptée.')) break;
      await agir(async()=>{
        await rpc('admin_refuser_attente', { p_reservation: el.dataset.id });
        const [p] = await Promise.all([ rpc('detail_creneau',{p_creneau: S.sheet.id}), chargerCreneaux() ]);
        S.sheet.participants = p || [];
        flash('ok','Demande refusée. La personne est prévenue.');
      }); break;
    }

    case 'presence': await agir(async()=>{
      await rpc('admin_presence', { p_reservation: el.dataset.id, p_presence: el.dataset.val });
      S.sheet.participants = await rpc('detail_creneau',{p_creneau: S.sheet.id});
    }); break;

    case 'capacite': {
      const v = Number($('#d-cap')?.value || 0);
      if (!v || v < 1) { flash('err','Nombre de places invalide.'); break; }
      await agir(async()=>{
        const { error } = await sb.from('creneaux').update({capacite:v}).eq('id', el.dataset.id);
        if (error) throw error;
        await chargerCreneaux();
        S.sheet.participants = await rpc('detail_creneau',{p_creneau: el.dataset.id});
        flash('ok','Nombre de places mis à jour.');
      }); break;
    }

    case 'annuler-cours': S.sheet = { type:'annuler', id: el.dataset.id }; render(); break;

    case 'copier': try { await navigator.clipboard.writeText(el.dataset.lien); flash('ok','Lien copié.'); } catch { flash('err','Copie impossible — sélectionne le lien à la main.'); } break;
    case 'partager': if (navigator.share) { try { await navigator.share({title:S.params.nom_cabinet, text:'Réserve tes cours de renforcement musculaire ici :', url:el.dataset.lien}); } catch {} } else { try { await navigator.clipboard.writeText(el.dataset.lien); flash('ok','Lien copié.'); } catch {} } break;
  }
});

document.addEventListener('input', (e)=>{ if (e.target.id === 'msg-texte') ajusterZone(e.target); });
document.addEventListener('change', (e)=>{ if (e.target.id === 'nouvelle-conv' && e.target.value) { S.conv = e.target.value; marquerLu(S.conv); S.scrollBas = true; render(); } });
document.addEventListener('change', (e)=>{
  if (e.target.id === 'rel-tout') { document.querySelectorAll('.rel-sel').forEach(x => x.checked = e.target.checked); return; }
  if (e.target.classList && e.target.classList.contains('rel-sel')) {
    const t = $('#rel-tout'); if (t) t.checked = [...document.querySelectorAll('.rel-sel')].every(x => x.checked); return;
  }
  if (e.target.id === 'rel-modele') {
    const v = e.target.value, m = $('#rel-msg'), t = $('#rel-titre');
    if (v === '__places') { m.value = MSG_PLACES.message; t.value = MSG_PLACES.titre; }
    else if (v === '__libre') { m.value = ''; t.value = '💌 Un message de Marine'; m.focus(); }
    else { const r = (S.rappels || []).find(x => x.id === v); if (r) { m.value = r.message || ''; t.value = r.titre || ''; } }
  }
});
document.addEventListener('keydown', (e)=>{
  if (e.target.id === 'msg-texte' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('input', (e)=>{
  if (e.target.dataset.act === 'recherche'){ S.recherche = e.target.value; const v = e.target.value; render();
    const f = $('#q'); if (f){ f.focus(); f.setSelectionRange(v.length, v.length); } }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'logo-fichier' && e.target.files && e.target.files[0]){
    const f = e.target.files[0];
    await agir(async()=>{ await envoyerLogo(f); flash('ok','Logo enregistré ✨'); });
    return;
  }
  const inp = e.target.closest('[data-photo-for]');
  if (!inp || !inp.files || !inp.files[0]) return;
  await agir(async()=>{
    await envoyerPhoto(inp.files[0], inp.dataset.photoFor);
    await chargerProfil(); if (estAdmin()) await chargerAdherentes();
    flash('ok','Photo enregistrée.');
  });
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'rp-rep') return;
  document.querySelectorAll('#frappel [data-rep]').forEach(b => b.hidden = b.dataset.rep !== e.target.value);
});
document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-lot-date]');
  if (!el) return;
  await agir(async()=>{
    await rpc('admin_date_lot', { p_lot: el.dataset.lotDate, p_expire: el.value || null });
    await chargerLots();
    flash('ok', el.value ? `Date limite mise au ${fExp(el.value)}. La cliente est prévenue.` : 'Date limite retirée.');
  });
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));

  if (f.id === 'fmsg') {
    const texte = (d.texte || '').trim();
    if (!texte || S.envoi) return;
    const cle = S.conv, ta = document.getElementById('msg-texte');
    S.envoi = true; if (ta) { ta.value = ''; ajusterZone(ta); }
    const { data, error } = await sb.from('messages').insert({ conv: cle === 'groupe' ? null : cle, texte, info: !!d.info }).select().single();
    S.envoi = false;
    if (error) { if (ta) ta.value = texte; flash('err', messageErreur(error)); return; }
    if (data) ajouterMessage(data);
    marquerLu(cle);
    const cb = f.querySelector('input[name=info]'); if (cb) cb.checked = false;
    rafraichirChat(false); window.scrollTo(0, document.body.scrollHeight);
    return;
  }

  if (f.id === 'fbug') return agir(async()=>{
    const texte = (d.texte||'').trim();
    if (!texte) throw new Error('message_vide');
    const contexte = `${estAdmin() ? 'Marine' : 'adhérente'} · ${VERSION} · ${navigator.userAgent.includes('iPhone') ? 'iPhone' : navigator.userAgent.includes('Android') ? 'Android' : 'ordinateur'}`;
    const { error } = await sb.from('bugs').insert({ texte, contexte });
    if (error) throw error;
    const t = $('#bg-txt'); if (t) t.value = '';
    await chargerBugs();
    flash('ok','Merci ! C’est envoyé, on regarde ça 🐞');
  });

  if (f.id === 'fannuler') return agir(async()=>{
    const r = await rpc('admin_annuler_creneau', { p_creneau: f.dataset.id, p_message: (d.message||'').trim() });
    await chargerCreneaux(); S.sheet = null;
    flash('ok', `Cours annulé · ${r.remboursees} séance${r.remboursees>1?'s':''} rendue${r.remboursees>1?'s':''} · tout le monde est prévenu.`);
  });

  if (f.id === 'fbesoin') return agir(async()=>{
    await rpc('maj_besoin', { p_creneau: f.dataset.id, p_texte: (d.texte||'').trim() });
    await chargerCreneaux(); S.sheet = null;
    flash('ok', (d.texte||'').trim() ? 'C’est noté, Marine est prévenue 💛' : 'Besoin effacé.');
  });

  if (f.id === 'fauth') return agir(async()=>{
    if (S.authMode === 'reset'){
      const { error } = await sb.auth.resetPasswordForEmail(d.email, { redirectTo: location.origin + location.pathname });
      if (error) throw error;
      S.authMode='login'; flash('ok','Si un compte existe, un email vient de partir (pense aux spams).'); return;
    }
    if (S.authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({
        email:d.email.trim(), password:d.mdp,
        options:{ data:{ nom:d.nom.trim(), prenom:d.prenom.trim(), telephone:d.telephone.trim() } }
      });
      if (error) throw error;
      if (!data.session){ const r2 = await sb.auth.signInWithPassword({ email:d.email.trim(), password:d.mdp }); if (r2.error){ S.authMode='login'; flash('ok','Compte créé ! Tu peux maintenant te connecter.'); return; } }
      return;
    }
    const { error } = await sb.auth.signInWithPassword({ email:d.email.trim(), password:d.mdp });
    if (error) throw error;
  });

  if (f.id === 'fprofil') return agir(async()=>{
    const { error } = await sb.from('adherentes')
      .update({ prenom:d.prenom.trim(), nom:d.nom.trim(), telephone:d.telephone.trim(),
                date_naissance: d.date_naissance || null, adresse: (d.adresse||'').trim(), infos: (d.infos||'').trim() })
      .eq('id', S.profil.id);
    if (error) throw error;
    await chargerProfil(); flash('ok','Informations enregistrées.');
  });

  if (f.id === 'freglages') return agir(async()=>{
    const { error } = await sb.from('parametres').update({
      nom_cabinet: d.nom_cabinet.trim(),
      telephone: (d.telephone||'').trim(),
      delai_annulation_h: Number(d.delai),
      min_participants: Number(d.min_participants),
      delai_min_h: Number(d.delai_min)
    }).eq('id', true);
    if (error) throw error;
    await chargerProfil(); flash('ok','Réglages enregistrés.');
  });

  if (f.id === 'frappel') return agir(async()=>{
    const jours = [0,1,2,3,4,5,6].filter(j => f.querySelector(`[name="j${j}"]`)?.checked);
    const row = { titre: d.titre.trim(), message: d.message.trim(), cible: d.cible, heure: d.heure, repetition: d.repetition,
      jours, jour_mois: Number(d.jour_mois||1), date_unique: d.date_unique || null };
    if (row.repetition === 'hebdo' && !jours.length) throw new Error('Choisis au moins un jour.');
    if (row.repetition === 'une_fois' && !row.date_unique) throw new Error('Choisis la date du rappel.');
    const id = f.dataset.id;
    const { error } = id ? await sb.from('rappels').update(row).eq('id', id) : await sb.from('rappels').insert({ ...row, actif:true });
    if (error) throw error;
    S.sheet = null; await chargerRappels(); flash('ok', id ? 'Rappel enregistré.' : 'Rappel créé.');
  });

  if (f.id === 'fdemande') return agir(async()=>{
    const nb = Number(d.nombre);
    await rpc('demander_credits', { p_nb: nb, p_message: (d.message||'').trim() });
    await chargerDemandes();
    flash('ok', `Demande de ${seances(nb)} envoyée à Marine. Elle les ajoutera après ton paiement au cabinet.`);
  });

  if (f.id === 'fvideo') return agir(async()=>{
    const lien = d.lien.trim();
    if (!/^https?:\/\//i.test(lien)) throw new Error('Colle un lien qui commence par https://');
    const fin = new Date(d.expire);
    if (!(fin > new Date())) throw new Error('La date d’effacement doit être dans le futur.');
    const { error } = await sb.from('videos').insert({
      titre: d.titre.trim() || 'Cours du lundi soir', lien, note: (d.note||'').trim(), expire_le: fin.toISOString()
    });
    if (error) throw error;
    await chargerVideos(); flash('ok', `Vidéo en ligne jusqu’au ${fJusqua(fin)}.`);
  });

  if (f.id === 'fannonce') return agir(async()=>{
    const texte = d.texte.trim();
    if (!texte) throw new Error('Écris le message de l’annonce.');
    if (d.debut && d.fin && d.fin < d.debut) throw new Error('La date de fin est avant la date de début.');
    const prevenir = !!d.notifier;
    const { error } = await sb.from('annonces').insert({
      texte, ton: d.ton, debut: d.debut || null, fin: d.fin || null, notifier: prevenir
    });
    if (error) throw error;
    await chargerAnnonces();
    const plusTard = d.debut && d.debut > dayKey(new Date());
    flash('ok', !prevenir ? 'Annonce publiée (sans notification).'
      : plusTard ? 'Annonce programmée. La notification partira quand elle s’affichera.'
      : 'Annonce publiée · notification envoyée à toutes les adhérentes 🔔');
  });

  if (f.id === 'fcreneau') return agir(async()=>{
    const base = new Date(`${d.date}T${d.heure}`);
    if (isNaN(base)) throw new Error('Date invalide.');
    const n = Number(d.repeter) || 1;
    const lignes = Array.from({length:n}, (_,i)=>{
      const dt = new Date(base.getTime()); dt.setDate(dt.getDate() + i*7);
      return { debut: dt.toISOString(), duree_min:Number(d.duree), capacite:Number(d.capacite),
               titre:d.titre.trim() || 'Renforcement musculaire des muscles profonds', lieu:(d.lieu||'').trim(), note:(d.note||'').trim() };
    });
    const { error } = await sb.from('creneaux').insert(lignes);
    if (error) throw error;
    await chargerCreneaux(); S.sheet = null;
    flash('ok', n>1 ? `${n} cours créés.` : 'Cours créé.');
  });
});

/* ------------------------------------------------------------------ boot */
async function demarrer(session){
  S.session = session;
  if (!session){ S.profil = null; render(); return; }
  render();
  await chargerProfil();
  if (!S.profil){ render(); return; }
  S.vue = estAdmin() ? 'planning' : 'cours';
  if (S.profil.statut === 'active' || estAdmin()){
    await Promise.all([chargerCreneaux(), chargerAnnonces()]);
    if (estAdmin()) await chargerAdherentes(); else await Promise.all([chargerHistorique(), chargerLots()]);
    if (estAdmin() || S.profil.acces_videos) await chargerVideos();
    await chargerDemandes();
    try { await chargerMessages(); abonnerMessages(); } catch {}
    if (estAdmin()) { try { await chargerBugs(); } catch {} }
  }
  await Promise.all([chargerNotifs(), etatPush()]);
  initActualisation();
  if (new URLSearchParams(location.search).has('maj') && new URLSearchParams(location.search).get('vue') !== 'messages') history.replaceState(null, '', location.pathname);
  if (new URLSearchParams(location.search).get('vue') === 'messages' && (S.profil.statut === 'active' || estAdmin())) {
    history.replaceState(null, '', location.pathname); ouvrirMessages(); return;
  }
  render();
}

const { data:{ session } } = await sb.auth.getSession();
await demarrer(session);
sb.auth.onAuthStateChange(async (evt, s) => {
  if (evt === 'PASSWORD_RECOVERY'){
    const mdp = prompt('Choisis un nouveau mot de passe (8 caractères minimum) :');
    if (mdp && mdp.length >= 8){
      const { error } = await sb.auth.updateUser({ password: mdp });
      flash(error ? 'err' : 'ok', error ? messageErreur(error) : 'Mot de passe modifié.');
    }
    return demarrer(s);
  }
  if (evt === 'SIGNED_IN' && !S.profil) demarrer(s);
  if (evt === 'SIGNED_OUT'){ S.session=null; S.profil=null; render(); }
});
</script>
